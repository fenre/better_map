# CI — better_map Splunk custom visualization
#
# Scope: ROADMAP §3 G2 foundation + §3 G8 + §7b Q-1 + §7b Q-2 + §7b Q-3
# + REL-1 version-consistency check (PR pipeline).
# This workflow lints the JS, runs the JS↔CSS contract lint, parses every
# dashboard XML + its embedded Dashboard Studio JSON definition, builds
# the webpack production bundle, runs the production-bundle console-noise
# check, runs the bundle-size budget check against the §7b table,
# verifies the three version sources (app.conf / package.json / HUD_VERSION)
# agree, sanity-checks the build artifacts, and validates incoming PR
# commit messages against Conventional Commits.
# It does NOT (yet) run AppInspect, unit tests, or the live dispatch
# test. Those gates are tracked as v1.7 follow-up commits under ROADMAP
# §3 G2 and as quality boxes in ROADMAP §7b / §7c-widget.
# Release automation lives in `.github/workflows/release.yml` and runs
# on `v*` tag pushes (see ROADMAP §3 G2 REL-1).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same PR to save Actions minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-and-build:
    name: Lint and build viz bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        # Every script in this job assumes the working dir is the viz package
        # so we don't have to repeat `cd` in every step. The viz lives several
        # levels deep so npm caching needs the full path on `cache-dependency-path`.
        working-directory: better_map/appserver/static/visualizations/better_map

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18 (matches viz engines.node)
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: better_map/appserver/static/visualizations/better_map/package-lock.json

      - name: Install viz dependencies (clean, reproducible)
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Check version consistency (REL-1)
        # Asserts app.conf [launcher] version, package.json version, and
        # debugHud.js HUD_VERSION all agree. Catches the "I bumped one of
        # the three" failure mode before a tag is cut. The release
        # workflow runs the same check with --tag to also verify the git
        # tag matches. ROADMAP §3 G2 + REL-1.
        working-directory: ${{ github.workspace }}
        run: node scripts/check-version-consistency.js

      - name: Lint (G8 JS↔CSS contract)
        # Asserts that every `better_map-*` class created in src/lib/**/*.js
        # has a matching rule in visualization.css OR an entry in
        # scripts/css-contract-allowlist.json. Defends against the
        # BM-FIX-01 / BM-FIX-02 class of bug where 21 widget classes shipped
        # in v1.6.0 with zero CSS rules. See ROADMAP §3 G8.
        run: npm run lint:css-contract

      - name: Check dashboard XML + Studio JSON (Q-1)
        # Walks every default/data/ui/views/*.xml and verifies (a) the
        # XML is well-formed, (b) the <![CDATA[...]]> inside <definition>
        # parses as JSON, (c) the JSON has the minimum Dashboard Studio
        # shape (title, dataSources, visualizations, layout). Defends
        # against the "typo'd CDATA closing tag" / "missing brace" /
        # "unescaped & in <label>" class of bug. ROADMAP §3 G2 + §7b.
        working-directory: ${{ github.workspace }}
        run: python3 scripts/check-dashboard-xml-json.py

      - name: Build webpack production bundle
        run: npm run build

      - name: Check production-bundle console noise (Q-2)
        # Two-layer check: (1) source lint forbids raw console.log/.debug/.info
        # /.trace/.table/.group/.time/.count/.assert in src/**/*.js and requires
        # any console.warn/.error to start with `[better_map]`; (2) bundle
        # sanity asserts the minified visualization.js total console.* call
        # count stays within budget (defends against a dev-mode bundle or
        # noisy new dep accidentally shipping). debugHud, errorStates, and
        # perfHUD are allowlisted as intentional diagnostic surfaces. See
        # ROADMAP §3 G2 + §7b Q-2.
        working-directory: ${{ github.workspace }}
        run: node scripts/check-bundle-console-noise.js

      - name: Check bundle-size budget (Q-3)
        # Asserts the production artifacts stay within the ROADMAP §7b table:
        #   - visualization.js  raw      ≤ 3.0 MB
        #   - visualization.js  gzipped  ≤ 800 KB
        #   - visualization.css raw      ≤ 100 KB (project-local)
        # Defends the cold-start performance contract against silent bloat
        # (new heavy dep, accidental source-map ship, terser disabled,
        # tree-shaking regression). Zero new deps; uses Node's built-in
        # zlib for the gzip measurement. See ROADMAP §3 G2 + §7b + §7c-widget.
        working-directory: ${{ github.workspace }}
        run: node scripts/check-bundle-size.js

      - name: Sanity check build artifacts
        # The webpack build MUST produce a non-empty visualization.js bundle.
        # visualization.css is hand-authored, not generated, so we only check
        # that the file is present and non-empty. ROADMAP §7c-widget defines
        # bundle-size budgets; an explicit `size-limit` check lands in a
        # later v1.7 commit.
        run: |
          set -eu
          js="visualization.js"
          css="visualization.css"
          if [ ! -s "$js" ]; then
            echo "::error file=$js::Build did not produce a non-empty $js"
            exit 1
          fi
          if [ ! -s "$css" ]; then
            echo "::error file=$css::Missing or empty $css"
            exit 1
          fi
          js_bytes=$(wc -c < "$js")
          css_bytes=$(wc -c < "$css")
          echo "visualization.js  = ${js_bytes} bytes"
          echo "visualization.css = ${css_bytes} bytes"

      - name: Upload built bundle as an artifact
        # Makes it possible to download a candidate bundle from a PR run
        # without rebuilding locally. Artifact is kept for 14 days
        # (GitHub default retention is 90; we keep it short to control
        # storage).
        uses: actions/upload-artifact@v4
        with:
          name: better_map-bundle-${{ github.sha }}
          path: |
            better_map/appserver/static/visualizations/better_map/visualization.js
            better_map/appserver/static/visualizations/better_map/visualization.css
          retention-days: 14
          if-no-files-found: error

  commitlint:
    name: Validate PR commit messages
    # Only on pull_request; push events to main are already trusted.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # commitlint needs the full PR history to lint every commit.
          fetch-depth: 0

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install commitlint
        # Pinned majors. Conventional config + CLI only; husky is dev-only
        # and not needed in CI.
        run: |
          npm install --no-save --no-audit --no-fund \
            @commitlint/cli@^19 \
            @commitlint/config-conventional@^19

      - name: Lint commit messages on the PR range
        # Lints every commit from the PR base ref to HEAD. Uses the project
        # config at .commitlintrc.cjs (extends config-conventional).
        run: |
          npx --no -- commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --config .commitlintrc.cjs
