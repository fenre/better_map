# CI — better_map Splunk custom visualization
#
# Scope: ROADMAP §3 G1 (npm-audit + license-allowlist + osv-scanner
# gates) + §3 G2 foundation + §3 G3 manifest + §3 G8 + §7b Q-1 +
# §7b Q-1B + §7b Q-2 + §7b Q-3 + REL-1 version-consistency check +
# G2-2 AppInspect gate + T-1 vitest unit-test scaffold (PR pipeline).
# This workflow lints the JS, runs the JS↔CSS contract lint, parses
# every dashboard XML + its embedded Dashboard Studio JSON definition,
# cross-checks every `$better_map.*$` dashboard token against widget
# producer literals in `src/lib/**/*.js` (Q-1B; SPATIAL-1 defence in
# depth), asserts the release manifest matches the source tree (G3;
# orphan-file defence in depth), gates on npm-audit / license-allowlist /
# osv-scanner findings against the runtime dep tree (G1; supply-chain
# defence in depth), runs the vitest unit-test suite, builds the
# webpack production bundle, runs the production-bundle console-noise
# check, runs the bundle-size budget check against the §7b table,
# verifies the three version sources (app.conf / package.json /
# HUD_VERSION) agree, sanity-checks the build artifacts, validates
# incoming PR commit messages against Conventional Commits, and runs
# Splunk AppInspect against the staged Splunk-app archive (cloud+future
# tags) to defend against AppInspect regressions before they reach a
# release tag.
# It does NOT (yet) run the live dispatch test. That gate is tracked
# as a v1.7 follow-up under ROADMAP §3 G2 (D5).
# Release automation lives in `.github/workflows/release.yml` and runs
# on `v*` tag pushes (see ROADMAP §3 G2 REL-1); SBOM generation and
# cosign keyless signing land in that workflow.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same PR to save Actions minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-and-build:
    name: Lint and build viz bundle
    runs-on: ubuntu-latest
    # Bumped 10 → 20 in v1.7-prep when D2 Phase 1 added the second and
    # third Playwright engines (firefox + webkit) to the install step.
    # Cold install of all three browsers + their --with-deps system
    # libraries runs ~10 minutes on ubuntu-latest; warm install
    # (browsers cached, see the Cache step below) is seconds.
    timeout-minutes: 20
    defaults:
      run:
        # Every script in this job assumes the working dir is the viz package
        # so we don't have to repeat `cd` in every step. The viz lives several
        # levels deep so npm caching needs the full path on `cache-dependency-path`.
        working-directory: better_map/appserver/static/visualizations/better_map

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18 (matches viz engines.node)
        uses: actions/setup-node@v6
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: better_map/appserver/static/visualizations/better_map/package-lock.json

      - name: Install viz dependencies (clean, reproducible)
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Check version consistency (REL-1)
        # Asserts app.conf [launcher] version, package.json version, and
        # debugHud.js HUD_VERSION all agree. Catches the "I bumped one of
        # the three" failure mode before a tag is cut. The release
        # workflow runs the same check with --tag to also verify the git
        # tag matches. ROADMAP §3 G2 + REL-1.
        working-directory: ${{ github.workspace }}
        run: node scripts/check-version-consistency.js

      - name: Lint (G8 JS↔CSS contract)
        # Asserts that every `better_map-*` class created in src/lib/**/*.js
        # has a matching rule in visualization.css OR an entry in
        # scripts/css-contract-allowlist.json. Defends against the
        # BM-FIX-01 / BM-FIX-02 class of bug where 21 widget classes shipped
        # in v1.6.0 with zero CSS rules. See ROADMAP §3 G8.
        run: npm run lint:css-contract

      - name: Check dashboard XML + Studio JSON (Q-1)
        # Walks every default/data/ui/views/*.xml and verifies (a) the
        # XML is well-formed, (b) the <![CDATA[...]]> inside <definition>
        # parses as JSON, (c) the JSON has the minimum Dashboard Studio
        # shape (title, dataSources, visualizations, layout). Defends
        # against the "typo'd CDATA closing tag" / "missing brace" /
        # "unescaped & in <label>" class of bug. ROADMAP §3 G2 + §7b.
        working-directory: ${{ github.workspace }}
        run: python3 scripts/check-dashboard-xml-json.py

      - name: Check dashboard ↔ widget token contract (Q-1B)
        # Defends against the SPATIAL-1 regression class: a dashboard
        # references `$better_map.<name>$` but no widget emits that
        # token. Walks every dashboard for `better_map.*` token
        # consumers, scans src/lib/**/*.js (non-test) for matching
        # string literals, FAILs if any consumer has no producer.
        # Pre-fix on SPATIAL-1 this would have failed with
        # `orphan token: better_map.spatial_query`. Verified by an
        # acceptance test against the regressed source tree on the
        # branch that introduced this gate. ROADMAP §1c gap 16 +
        # Theme G follow-up.
        working-directory: ${{ github.workspace }}
        run: python3 scripts/check-dashboard-tokens.py

      - name: Check release manifest matches source tree (G3)
        # Defends against orphan-file accumulation across releases.
        # Splunk's `update=true` REST install extracts the new tarball
        # on top of the previous install but does NOT delete files
        # absent from the new tarball, so without a release manifest
        # an operator cannot deterministically detect orphans. This
        # gate regenerates the manifest from the source tree and
        # asserts it byte-matches `better_map/default/_better_map_manifest.json`.
        # On FAIL, run `python3 scripts/build-manifest.py` and commit
        # the result. The operator runbook `scripts/find-orphans.sh`
        # consumes this manifest. ROADMAP §3 G3.
        working-directory: ${{ github.workspace }}
        run: python3 scripts/check-manifest.py

      - name: Check formatter schema drift (G7)
        # Regenerates docs/_machine/formatter-schema.json from
        # formatter.html and FAILs on byte mismatch. On FAIL, run
        # `python3 scripts/build-formatter-schema.py` and commit the
        # updated schema in the same PR as the formatter.html change.
        # The schema is the machine-readable contract that AI agents
        # consume to set formatter properties correctly — drift means
        # an agent will set a non-existent option or miss a new one.
        # ROADMAP §3 G7.
        working-directory: ${{ github.workspace }}
        run: python3 scripts/check-formatter-schema.py

      - name: Check formatter schema coverage (G7)
        # Complements the drift gate with three explicit assertions
        # that catch failure modes the byte-equality check cannot:
        #   1. HTML → schema: every data-name in formatter.html
        #      appears as a property in the schema (catches silent
        #      parser drops).
        #   2. Schema → HTML: every property in the schema maps to a
        #      data-name in formatter.html (catches phantom entries
        #      from hand-edits).
        #   3. Duplicate transparency: every duplicate data-name in
        #      the HTML is recorded in x-meta.known-issues (catches
        #      stale or missing duplicate records).
        # ROADMAP §3 G7.
        working-directory: ${{ github.workspace }}
        run: python3 scripts/check-formatter-coverage.py

      - name: Read Playwright version from package-lock (D2 + D3 cache key)
        # The cache below is keyed on the EXACT Playwright version
        # pulled into the viz package, so a version bump in
        # package-lock.json forces a clean re-install (browser binary
        # layouts can change between Playwright minor versions). The
        # version is read directly from the lockfile so the workflow
        # has no hidden dependency on the actual installed semver.
        id: playwright-version
        run: |
          v=$(node -e "console.log(require('./package-lock.json').packages['node_modules/playwright'].version)")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Playwright lockfile version: $v"

      - name: Cache Playwright browser binaries (D2 + D3)
        # Caches ~/.cache/ms-playwright between runs so the cold
        # `npx playwright install --with-deps chromium firefox webkit`
        # step only pays the ~10 min download cost on lockfile bumps,
        # not every PR. The system-package install (`--with-deps`)
        # still re-runs every time (apt-get is fast on warm hits).
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers (D2 + D3 — only on cache miss)
        # Playwright ships browser binaries separately from the npm
        # package — `npm ci` only fetches the JS adapter. We install
        # all three engine families so that:
        #   - D3 (axe-core accessibility) runs on Chromium (sufficient
        #     because formatter.html is a Splunk-hosted fragment and
        #     axe rules are engine-agnostic at the WCAG level we test).
        #   - D2 Phase 1 (browser-compat load test) runs against
        #     {chromium, firefox, webkit} — the three engine families
        #     that together cover ~99 % of real browsers in the field
        #     (Chrome / Edge / Opera / Brave + Safari / iOS + Firefox).
        # SKIPPED on cache hits — browsers are already on disk under
        # ~/.cache/ms-playwright from the previous run with the same
        # Playwright version. Cold install (cache miss or version
        # bump) takes ~9-10 min on ubuntu-latest because firefox +
        # webkit binaries are 50-90 MB each; warm install is 0 s.
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium firefox webkit

      - name: Install Playwright system deps (D2 + D3 — always)
        # System libraries (libnss3, libatk-bridge2.0-0, libxkbcommon0,
        # libgbm1, etc.) live outside the cached ~/.cache/ms-playwright
        # tree, so they MUST re-`apt-get install` on every runner. apt
        # is fast on warm runners (~10 s) and ubuntu-latest already
        # carries most of what Chromium needs; the missing libs are
        # almost always webkit / firefox specific. On cache HIT this
        # is the only Playwright-related step that does meaningful
        # work, keeping the warm-CI cost ~15 s instead of ~10 min.
        run: npx playwright install-deps chromium firefox webkit

      - name: Check accessibility (D3 — axe-core on formatter.html)
        # ROADMAP §3 D3 Phase 1 + §7b "WCAG 2.2 AA conformance
        # verified" box.
        # Loads `formatter.html` (wrapped in a minimal HTML5 page so
        # axe sees document-level landmarks) in headless Chromium and
        # runs axe-core against the WCAG 2.0 A/AA + 2.1 A/AA + 2.2 AA
        # tag set. ZERO violations is the bar; the gate also reports
        # `incomplete` findings for manual review on release-prep but
        # does NOT fail on them. JSON report is uploaded for offline
        # triage. Phase 2 (axe inside Playwright on the 12 showcase
        # dashboards) lands with D5 (Splunk Docker compose harness).
        # On FAIL, run locally via:
        #   cd better_map/appserver/static/visualizations/better_map
        #   npm run lint:a11y
        # and either fix the markup or, if the rule is genuinely a
        # host-page concern, add the rule id to DISABLED_RULES in
        # scripts/check-accessibility.js with a one-line justification.
        working-directory: ${{ github.workspace }}
        run: node scripts/check-accessibility.js

      - name: Upload accessibility report (D3)
        # Always upload — the value is greatest on FAIL, when the
        # in-line summary truncates affected-node lists at 5 per rule.
        # Short retention because every PR produces one; main-branch
        # runs carry the canonical evidence.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-report-${{ github.sha }}
          path: reports/accessibility-report.json
          retention-days: 14
          if-no-files-found: warn

      - name: Check browser compatibility (D2 — formatter.html in chromium + firefox + webkit)
        # ROADMAP §3 D2 Phase 1 + §4 v1.7 milestone exit-criterion
        # "showcases pass on Chrome, Firefox, Safari, Edge × ...".
        # Loads `formatter.html` (wrapped in a minimal HTML5 page —
        # same wrapper pattern as D3 so a regression in the wrapper
        # affects both gates identically) in headless Chromium,
        # Firefox, and WebKit via Playwright. Captures console.error
        # events, page errors, and failed network requests; FAILs if
        # any engine reports any error.
        # Defends against the "ships in Chrome, breaks in Safari /
        # Firefox" class of bug — the bundle is built with
        # `target: ['web', 'es5']` precisely so the AMD loader on
        # every browser can `require()` it, but nothing else in CI
        # asserts the produced `visualization.js` actually parses +
        # executes in WebKit and Firefox.
        # Phase 1 is Linux-only (because GitHub free runners are
        # Linux); cross-OS matrix runs (macOS Safari + Windows Edge)
        # fall to Phase 2, blocked on a self-hosted-runner decision
        # per ROADMAP §3 D5 risk note.
        working-directory: ${{ github.workspace }}
        run: node scripts/check-browser-compat.js

      - name: Upload browser-compat report (D2)
        # Always upload so the full per-engine error list and three
        # screenshots (chromium / firefox / webkit) are available
        # for offline triage even when the inline summary truncates.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-compat-report-${{ github.sha }}
          path: |
            reports/browser-compat-report.json
            reports/browser-compat/
          retention-days: 14
          if-no-files-found: warn

      - name: Check npm audit (G1) — fail on high+ without an active waiver
        # G1 supply-chain gate: runs `npm audit --omit=dev --json` in
        # the viz package and FAILs if any finding at severity `high`
        # or `critical` is NOT covered by an in-date waiver in
        # `scripts/npm-audit-waivers.json`. Waivers expire automatically
        # (≤ 90 days from `added`), forcing re-justification rather
        # than indefinite suppression. The v1.7 baseline ships zero
        # waivers. See ROADMAP §3 G1 + §7d.
        working-directory: ${{ github.workspace }}
        run: python3 scripts/check-npm-audit.py

      - name: Check license allowlist (G1) — only MIT/BSD/Apache/CC0/ISC family
        # G1 supply-chain gate: walks every runtime (--omit=dev)
        # dependency installed under node_modules, normalizes the
        # SPDX license id (handles dual-license disjunctions, upstream
        # typos, and known-good packages whose package.json omits the
        # field), and FAILs if any dep cannot resolve to an SPDX id on
        # `scripts/license-allowlist.json#allowed_spdx`. Defends
        # against accidentally pulling in a copyleft transitive dep
        # that would block Splunkbase or large-enterprise legal review.
        # See ROADMAP §3 G1 + §7d.
        working-directory: ${{ github.workspace }}
        run: python3 scripts/check-license-allowlist.py

      - name: Install OSV-Scanner (G1) — second-opinion vulnerability scanner
        # Pinned via env so the version is a single-line PR diff to bump.
        # Installs the official Linux x86_64 release binary into a
        # tool dir on $PATH. Verified by a `--version` echo before use.
        # We deliberately do NOT use the upstream reusable workflow
        # (`google/osv-scanner-action/.github/workflows/osv-scanner-reusable*.yml`)
        # because it routes findings into GitHub's Security tab via
        # SARIF — that's the right home for the scheduled scan we add
        # later, but for a PR gate we want a hard, in-line, grep-able
        # FAIL with a stable JSON report.
        env:
          OSV_SCANNER_VERSION: 'v2.3.8'
        run: |
          set -eu
          mkdir -p "${RUNNER_TEMP}/osv-bin"
          curl -sLfo "${RUNNER_TEMP}/osv-bin/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          chmod +x "${RUNNER_TEMP}/osv-bin/osv-scanner"
          echo "${RUNNER_TEMP}/osv-bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/osv-bin/osv-scanner" --version

      - name: Run OSV-Scanner against the viz lockfile (G1)
        # `|| true` because OSV-Scanner exits non-zero on ANY finding
        # (info+). We want a severity-threshold-aware gate so that
        # `low` / `moderate` findings inform but don't block. The
        # downstream `check-osv-report.py` reads the JSON and FAILs on
        # high+ severity that isn't already waived in
        # `scripts/npm-audit-waivers.json` (shared waiver file with the
        # npm-audit gate — one CVE, one decision). `--output-file` is
        # the supported flag from osv-scanner v2.x; the older `--output`
        # alias is deprecated and will be removed.
        working-directory: ${{ github.workspace }}
        run: |
          set -eu
          osv-scanner --format=json \
            --lockfile=./better_map/appserver/static/visualizations/better_map/package-lock.json \
            --output-file=osv-report.json || true
          test -s osv-report.json
          echo 'OSV-Scanner JSON report written; size:'
          wc -c osv-report.json

      - name: Assert OSV-Scanner findings (G1, severity high+, shared waivers)
        working-directory: ${{ github.workspace }}
        run: python3 scripts/check-osv-report.py osv-report.json

      - name: Upload OSV-Scanner JSON report (G1)
        # Saved for post-merge audit + Splunkbase submission. Short
        # retention because every PR produces one; the value is in
        # the latest main-branch run.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: osv-scanner-report-${{ github.sha }}
          path: osv-report.json
          retention-days: 14
          if-no-files-found: warn

      - name: Run unit tests (vitest, T-1 scaffold)
        # Executes src/lib/**/*.test.js under jsdom. Currently covers
        # src/lib/popupSanitizer.js with 71 cases (security-critical
        # module: every popup HTML string, every map URL, and every
        # image src flows through one of its exports). Subsequent PRs
        # raise coverage file-by-file under ROADMAP Theme C.
        # `CI=true` switches vitest to the `dot` reporter so the log
        # stays compact (default reporter is noisy in CI).
        env:
          CI: 'true'
        run: npm test

      - name: Build webpack production bundle
        run: npm run build

      - name: Check production-bundle console noise (Q-2)
        # Two-layer check: (1) source lint forbids raw console.log/.debug/.info
        # /.trace/.table/.group/.time/.count/.assert in src/**/*.js and requires
        # any console.warn/.error to start with `[better_map]`; (2) bundle
        # sanity asserts the minified visualization.js total console.* call
        # count stays within budget (defends against a dev-mode bundle or
        # noisy new dep accidentally shipping). debugHud, errorStates, and
        # perfHUD are allowlisted as intentional diagnostic surfaces. See
        # ROADMAP §3 G2 + §7b Q-2.
        working-directory: ${{ github.workspace }}
        run: node scripts/check-bundle-console-noise.js

      - name: Check bundle-size budget (Q-3)
        # Asserts the production artifacts stay within the ROADMAP §7b table:
        #   - visualization.js  raw      ≤ 3.0 MB
        #   - visualization.js  gzipped  ≤ 800 KB
        #   - visualization.css raw      ≤ 100 KB (project-local)
        # Defends the cold-start performance contract against silent bloat
        # (new heavy dep, accidental source-map ship, terser disabled,
        # tree-shaking regression). Zero new deps; uses Node's built-in
        # zlib for the gzip measurement. See ROADMAP §3 G2 + §7b + §7c-widget.
        working-directory: ${{ github.workspace }}
        run: node scripts/check-bundle-size.js

      - name: Sanity check build artifacts
        # The webpack build MUST produce a non-empty visualization.js bundle.
        # visualization.css is hand-authored, not generated, so we only check
        # that the file is present and non-empty. ROADMAP §7c-widget defines
        # bundle-size budgets; an explicit `size-limit` check lands in a
        # later v1.7 commit.
        run: |
          set -eu
          js="visualization.js"
          css="visualization.css"
          if [ ! -s "$js" ]; then
            echo "::error file=$js::Build did not produce a non-empty $js"
            exit 1
          fi
          if [ ! -s "$css" ]; then
            echo "::error file=$css::Missing or empty $css"
            exit 1
          fi
          js_bytes=$(wc -c < "$js")
          css_bytes=$(wc -c < "$css")
          echo "visualization.js  = ${js_bytes} bytes"
          echo "visualization.css = ${css_bytes} bytes"

      - name: Upload built bundle as an artifact
        # Makes it possible to download a candidate bundle from a PR run
        # without rebuilding locally. Artifact is kept for 14 days
        # (GitHub default retention is 90; we keep it short to control
        # storage).
        uses: actions/upload-artifact@v7
        with:
          name: better_map-bundle-${{ github.sha }}
          path: |
            better_map/appserver/static/visualizations/better_map/visualization.js
            better_map/appserver/static/visualizations/better_map/visualization.css
          retention-days: 14
          if-no-files-found: error

  appinspect:
    name: Splunk AppInspect (cloud + future)
    # Runs in parallel with `lint-and-build`. AppInspect needs the BUILT
    # `visualization.js` present in the app tree (not just src/), so this
    # job has to perform its own npm ci + webpack build. The extra build
    # cost is ~1m of wall-clock; the trade-off buys clearly-named gate
    # failures and independent retry-ability if a hosted AppInspect dep
    # store hiccups.
    # See ROADMAP §3 G2-2 and Theme D D1.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18 (matches viz engines.node)
        uses: actions/setup-node@v6
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: better_map/appserver/static/visualizations/better_map/package-lock.json

      - name: Set up Python 3.11 (for splunk-appinspect)
        # `cache-dependency-path` is required for `cache: pip` to compute
        # a cache key. We point at scripts/requirements-appinspect.txt —
        # the single source of truth for the AppInspect pin (see file
        # header for upgrade policy).
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-appinspect.txt

      - name: Install viz dependencies (clean, reproducible)
        working-directory: better_map/appserver/static/visualizations/better_map
        run: npm ci

      - name: Build webpack production bundle
        # AppInspect must see the bundled visualization.js — it is the
        # artifact that ships, not the src/ tree.
        working-directory: better_map/appserver/static/visualizations/better_map
        run: npm run build

      - name: Install splunk-appinspect (pinned via requirements)
        # Pin lives in scripts/requirements-appinspect.txt so the cache
        # key (above) and the install command read the same file. A
        # version bump is a single-file change with a clear PR diff.
        run: |
          python3 -m venv .venv-appinspect
          .venv-appinspect/bin/pip install --quiet --upgrade pip
          .venv-appinspect/bin/pip install --quiet -r scripts/requirements-appinspect.txt
          .venv-appinspect/bin/splunk-appinspect --version || true

      - name: Stage shippable app contents (mirror of release.yml)
        # Mirrors the rsync exclude-list in release.yml so the .spl we
        # inspect matches the .spl we'll ship. When this list changes,
        # update BOTH workflows together. (A future refactor into a
        # shared `scripts/package-app.sh` is tracked as a G2-2 follow-up.)
        run: |
          set -eu
          mkdir -p dist-appinspect
          rsync -a \
            --exclude='node_modules' \
            --exclude='src' \
            --exclude='scripts' \
            --exclude='docs' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='webpack.config.js' \
            --exclude='.eslintrc.cjs' \
            --exclude='.eslintignore' \
            --exclude='.npmrc' \
            --exclude='harness.json' \
            --exclude='AIR-GAPPED-PMTILES.md' \
            --exclude='build-pmtiles.sh' \
            better_map/ dist-appinspect/better_map/
          find dist-appinspect/better_map -name '._*' -delete
          find dist-appinspect/better_map -name '.DS_Store' -delete
          find dist-appinspect/better_map -type d -exec chmod 755 {} \;
          find dist-appinspect/better_map -type f -exec chmod 644 {} \;

      - name: Package as Splunk app archive
        env:
          COPYFILE_DISABLE: '1'
        run: |
          set -eu
          tar czf dist-appinspect/better_map.tar.gz -C dist-appinspect better_map
          ls -la dist-appinspect/

      - name: Run splunk-appinspect (cloud + future tags, JSON output)
        # `cloud` is the Splunkbase submission target; `future` surfaces
        # checks that will become hard failures in upcoming AppInspect
        # releases so we get advance warning before Splunkbase rejects us.
        # `--max-messages 100` is generous enough to surface every offender
        # for a typical regression without truncating; default is 25.
        run: |
          set -eu
          .venv-appinspect/bin/splunk-appinspect inspect \
            dist-appinspect/better_map.tar.gz \
            --output-file dist-appinspect/report.json \
            --data-format json \
            --max-messages 100 \
            --included-tags cloud \
            --included-tags future

      - name: Assert AppInspect result (G2-2 gate)
        # Hard-fails on error / failure / future_failure (> 0 of any).
        # Warnings are informational by default; the release workflow
        # passes --fail-on-warnings to enforce a zero-warning baseline
        # for tagged releases.
        run: python3 scripts/check-appinspect-results.py --report dist-appinspect/report.json

      - name: Upload AppInspect report artifact
        # `always()` so the report is downloadable even on failure (the
        # whole point — that's when you need it). Short retention so we
        # don't pay storage for green PR reports nobody will ever read.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appinspect-report-${{ github.sha }}
          path: dist-appinspect/report.json
          retention-days: 14
          if-no-files-found: warn

  commitlint:
    name: Validate PR commit messages
    # Only on pull_request; push events to main are already trusted.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # commitlint needs the full PR history to lint every commit.
          fetch-depth: 0

      - name: Set up Node.js 18
        uses: actions/setup-node@v6
        with:
          node-version: '18'

      - name: Install commitlint
        # Pinned majors. Conventional config + CLI only; husky is dev-only
        # and not needed in CI.
        run: |
          npm install --no-save --no-audit --no-fund \
            @commitlint/cli@^19 \
            @commitlint/config-conventional@^19

      - name: Lint commit messages on the PR range
        # Lints every commit from the PR base ref to HEAD. Uses the project
        # config at .commitlintrc.cjs (extends config-conventional).
        run: |
          npx --no -- commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --config .commitlintrc.cjs

  docs-build:
    # ROADMAP §3 E2 Phase 1 — documentation-site infrastructure.
    #
    # Builds the MkDocs Material site in `--strict` mode so that any
    # broken cross-link, orphan markdown file, deprecated config key,
    # or missing snippet path becomes a PR-blocking failure rather
    # than silent site rot. This job is intentionally separate from
    # `lint-and-build` so:
    #   - A docs-only PR doesn't pay the cost of `npm ci` + webpack
    #     + Playwright Chromium download.
    #   - A code-only PR with no docs touches still proves the docs
    #     site is buildable (the include-markdown plugin pulls
    #     CHANGELOG.md and ROADMAP.md from the repo root, so a
    #     malformed Markdown table in either file would otherwise
    #     only surface when E2 Phase 1 ships).
    #   - The `docs.yml` deploy workflow can fast-path off this job
    #     once we add a `workflow_call` trigger.
    #
    # On FAIL, reproduce locally with:
    #   python3 -m venv .venv-mkdocs
    #   .venv-mkdocs/bin/pip install -r scripts/requirements-mkdocs.txt
    #   .venv-mkdocs/bin/mkdocs build --strict
    name: Documentation site (MkDocs)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (matches release.yml)
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-mkdocs.txt

      - name: Install MkDocs + theme + plugins (pinned via requirements)
        # Pin lives in scripts/requirements-mkdocs.txt so the cache key
        # (above) and the install command read the same file. A version
        # bump is a single-file change with a clear PR diff. Mirrors
        # the AppInspect-job pattern (scripts/requirements-appinspect.txt).
        # mkdocs depends on PyYAML transitively, so the recipe-schema
        # gate below does NOT need a separate install step.
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet -r scripts/requirements-mkdocs.txt
          mkdocs --version

      - name: Check per-source recipe schema + index drift (E5 Phase 1)
        # ROADMAP §3 E5 Phase 1 + §7e "per-source recipe matrix" box.
        # Walks docs/recipes/<source>/<layer>.md and asserts:
        #   1. Frontmatter conforms to docs/_machine/recipes/recipe-schema.json.
        #   2. The filesystem path agrees with frontmatter id / source.id /
        #      layer.id.
        #   3. Six canonical markdown sections (1..6) are present in order.
        #   4. The §2 SPL fence is tagged `spl` and obeys SPL Pipe-Per-Line.
        #   5. The §4 JSON formatter-config fence parses, references only
        #      real options from formatter-schema.json, and the options
        #      set in §4 agree with required_formatter_options frontmatter.
        #   6. expected_fields entries appear in the §3 markdown table.
        #   7. docs/_machine/recipes/index.yaml regenerates byte-for-byte
        #      from the recipe files on disk (drift gate).
        # On FAIL, the script's stderr names the recipe + the violation;
        # for index drift specifically, run
        # `python3 scripts/build-recipe-index.py` and commit the result.
        run: python3 scripts/check-recipe-schema.py

      - name: Check docs/llms.txt is in sync (G7 Phase 2)
        # ROADMAP §3 G7 Phase 2 + §7e "llms.txt" box.
        # Regenerates `docs/llms.txt` from the structured sources of truth
        # (mkdocs.yml nav, _machine/integrations/*.yaml,
        # _machine/recipes/index.yaml, _machine/formatter-schema.json)
        # and exits non-zero if the on-disk file disagrees. The output
        # ships verbatim at the site root (`site/llms.txt`) per the
        # llms.txt convention: <https://llmstxt.org/>.
        # On FAIL, run `python3 scripts/build-llms-txt.py` and commit
        # the regenerated file.
        run: python3 scripts/build-llms-txt.py --check

      - name: Check docs/llms-full.txt is in sync (G7 Phase 2 — body-inclusive sibling)
        # ROADMAP §3 G7 Phase 2 follow-up + §7e "llms-full.txt" box.
        # Regenerates `docs/llms-full.txt` from the same structured
        # sources as `llms.txt` PLUS the body of every page in
        # `mkdocs.yml` `nav:` (with include-markdown directives
        # resolved inline so the ROADMAP / CHANGELOG bodies appear
        # under their wrapper pages). Exits non-zero if the on-disk
        # file disagrees OR if the total exceeds the hard 200k-token
        # budget. The output ships verbatim at the site root
        # (`site/llms-full.txt`) per the llms.txt convention:
        # <https://llmstxt.org/>. On FAIL, run
        # `python3 scripts/build-llms-full-txt.py` and commit the
        # regenerated file (or trim a page if the budget is the
        # cause of the FAIL).
        run: python3 scripts/build-llms-full-txt.py --check

      - name: Check auto-generated reference pages are in sync (E2 Phase 2)
        # ROADMAP §3 E2 Phase 2 + §3 G7 Phase 2.
        # Regenerates the managed regions inside `docs/reference/*.md`
        # (currently just the 82-option enumeration in formatter.md)
        # from the machine schema and exits non-zero if any on-disk
        # file disagrees. Managed regions live between the marker pair:
        #   <!-- BEGIN AUTOGEN: <section-id> -->
        #   ...content owned by the script; do NOT edit by hand...
        #   <!-- END AUTOGEN: <section-id> -->
        # Narrative outside the markers is hand-authored and survives.
        # On FAIL, run `python3 scripts/build-reference-pages.py` and
        # commit the regenerated file(s).
        run: python3 scripts/build-reference-pages.py --check

      - name: Build documentation site (strict mode)
        # `--strict` is the hammer: any MkDocs warning fails the build.
        # The site renders to `site/` (gitignored) — the GitHub Pages
        # deploy workflow uploads that directory verbatim. See
        # `.github/workflows/docs.yml`.
        run: mkdocs build --strict

      - name: Upload built site as an artifact (for triage)
        # `always()` so the artifact is downloadable even on failure —
        # mkdocs writes partial output before the final strict check
        # aborts, which helps reproduce link issues without re-running
        # the whole gate locally. Short retention (every PR produces
        # one; main-branch carries the canonical evidence).
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docs-site-${{ github.sha }}
          path: site/
          retention-days: 14
          if-no-files-found: warn
