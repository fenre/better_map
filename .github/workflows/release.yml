# Release — better_map Splunk custom visualization
#
# Scope: ROADMAP §3 G2 — release automation v1. G1 supply-chain
# hardening (CycloneDX SBOM + cosign keyless signing) now lives here.
#
# Triggered on push of any tag matching `v*` (e.g. `v1.7.0`, `v2.0.0-rc1`).
# Produces a GitHub Release with the canonical Splunk app archive
# (`better_map-vX.Y.Z.tar.gz` and its `.spl` alias) plus SHA-256 checksums.
#
# What this workflow does:
#   1. Re-run every PR-gate quality check against the tagged commit
#      (a release MUST clear the same bar a PR clears, no exceptions —
#      enforced under PR #41 + the G2 close-out audit; see
#      docs/CI-GATES.md for the per-gate matrix and intentional parity
#      contract between ci.yml and this file).
#   2. Assert all four version sources agree on the tag (REL-1 contract):
#        - app.conf [launcher] version
#        - app.conf [install]  build
#        - package.json version
#        - debugHud.js HUD_VERSION
#        - the tag itself
#      Without this, "the v1.7.0 release" could ship code labelled
#      v1.6.2 in the dashboard HUD and Apps UI.
#   3. Build the webpack production bundle.
#   4. Re-run Q-2 (console noise) + Q-3 (bundle size) against the fresh
#      bundle — defends against the "different bundle in CI vs release"
#      class of bug.
#   5. Re-run D2 browser-compat (formatter + bundle AMD-eval × chromium
#      + firefox + webkit) and D3 accessibility (axe-core on
#      formatter.html) against the fresh bundle — same defence-in-depth
#      posture as #4, scoped to runtime/UX regressions a tag from a
#      non-main commit could otherwise introduce.
#   6. Package the better_map/ directory as a tarball, clean of macOS
#      artifacts and with deterministic permissions (per
#      splunk-app-packaging.mdc).
#   7. Produce BOTH `better_map-vX.Y.Z.tar.gz` AND its `.spl` alias.
#      Splunkbase and AppInspect both accept either extension; we ship
#      both so consumers don't have to rename.
#   8. Compute SHA-256 for each artifact and attach as a sidecar file.
#   9. Create a GitHub Release using GitHub's auto-generated body
#      (conventional-commits-aware as of the commitlint rollout in PR #1)
#      and attach the four artifacts.
#
# What this workflow does NOT yet do (tracked as ROADMAP §3 G2 follow-ups):
#   - Splunkbase upload via REST (E1 — needs an approved listing + token)
#   - Docs-build gates (recipe schema, llms.txt, llms-full.txt,
#     reference-pages, MkDocs strict) — LOW stakes because docs are
#     excluded from the release tarball (rsync `--exclude='docs'`) and
#     are gated separately on push-to-main via docs.yml. See gap #1 in
#     docs/CI-GATES.md "Known gaps".
#
# G1 supply-chain steps that DO land in this workflow (ROADMAP §3 G1, §7d):
#   - PR-gate quality checks (npm audit, license-allowlist, OSV-Scanner)
#     re-run against the tagged commit for defence-in-depth (a release
#     MUST clear the same bar a PR clears).
#   - CycloneDX SBOM generated for the runtime dep tree and shipped as a
#     release artifact (`better_map-vX.Y.Z.sbom.json`).
#   - Cosign keyless signature over the .tar.gz, .spl, and SBOM. Uses
#     the GitHub OIDC token; no project-owned cosign key required. The
#     signature is a `.cosign.bundle` file (signature + cert + Rekor
#     transparency-log entry, all in one). Customers verify with the
#     command published in `docs/runbooks/supply-chain.md`.
#
# AppInspect (cloud + future tags) runs inline below in this workflow
# with `--fail-on-warnings` — a release MUST clear a stricter bar than
# a PR (PR-gate allows informational warnings; release-gate does not).
#
# How to release (manual, one-time per tag):
#
#   1. On main, run `node scripts/check-version-consistency.js` — must PASS.
#      (CI does this on every PR, so a green main is already a PASS.)
#   2. Bump the three version sources to the target version (e.g. 1.7.0):
#        - better_map/default/app.conf  [launcher] version + bump [install] build
#        - better_map/appserver/.../package.json  "version"
#        - better_map/appserver/.../src/lib/debugHud.js  HUD_VERSION
#      Open a release PR titled `chore(release): vX.Y.Z`. Merge after CI.
#   3. From the merged main commit, tag:
#        git tag -a vX.Y.Z -m "vX.Y.Z"
#        git push origin vX.Y.Z
#   4. This workflow runs. Watch the Actions tab; if anything fails, fix
#      on main and re-tag with a new patch number (you cannot reuse a
#      published tag without force-pushing, which IS allowed for releases
#      that never produced a public artifact — see step 5).
#   5. The release lands at https://github.com/<owner>/better_map/releases.
#      Verify the artifacts manually before announcing.

name: Release

on:
  push:
    tags:
      - 'v*'

# Permissions:
#   contents: write    — needed by `gh release create` to publish the
#                        Release. Never used to push back to main.
#   id-token: write    — needed by sigstore/cosign-installer's keyless
#                        flow: cosign exchanges the runner's OIDC token
#                        for a Fulcio-issued short-lived certificate.
#                        Without this permission `cosign sign-blob`
#                        cannot generate a signature. See
#                        https://docs.sigstore.dev/cosign/openid_signing/
permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    name: Build, verify, and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Need full history so GitHub Release auto-body can compute
          # commit range against the previous tag.
          fetch-depth: 0

      - name: Resolve tag and version
        # Extract the semver from the tag (strip leading `v`) and expose
        # both forms as workflow outputs / env for later steps.
        id: tag
        run: |
          set -eu
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          if [ -z "$TAG" ] || [ "$TAG" = "$GITHUB_REF" ]; then
            echo "::error::could not extract tag from GITHUB_REF=$GITHUB_REF"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG version=$VERSION"

      - name: Set up Node.js 18 (matches viz engines.node)
        uses: actions/setup-node@v6
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: better_map/appserver/static/visualizations/better_map/package-lock.json

      - name: Install viz dependencies (clean, reproducible)
        working-directory: better_map/appserver/static/visualizations/better_map
        run: npm ci

      - name: Check version consistency vs tag (REL-1)
        # All four sources MUST agree before we even build, so we fail
        # fast and don't waste CI minutes packaging a mismatched release.
        run: node scripts/check-version-consistency.js --tag=${{ steps.tag.outputs.tag }}

      - name: Lint (ESLint)
        working-directory: better_map/appserver/static/visualizations/better_map
        run: npm run lint

      - name: Lint (G8 JS↔CSS contract)
        working-directory: better_map/appserver/static/visualizations/better_map
        run: npm run lint:css-contract

      - name: Check dashboard XML + Studio JSON (Q-1)
        run: python3 scripts/check-dashboard-xml-json.py

      - name: Check dashboard ↔ widget token contract (Q-1B)
        run: python3 scripts/check-dashboard-tokens.py

      - name: Check release manifest matches source tree (G3)
        # Defence-in-depth: the PR-gate ran this check at merge time, so
        # a fresh tag from main should already pass. We re-run here so a
        # tag created from a stale branch (or a tag pointing at a commit
        # that bypassed PR review) cannot ship a manifest that lies about
        # the tarball contents. ROADMAP §3 G3.
        run: python3 scripts/check-manifest.py

      - name: Check formatter schema drift (G7)
        # Defence-in-depth re-run of the PR gate. A release that
        # ships with a stale formatter-schema.json would silently
        # publish a machine-readable contract that lies about the
        # supported options — every AI agent consuming this release's
        # schema would then make wrong decisions. ROADMAP §3 G7.
        run: python3 scripts/check-formatter-schema.py

      - name: Check formatter schema coverage (G7)
        run: python3 scripts/check-formatter-coverage.py

      - name: Check npm audit (G1) — high+ blocking, shared waivers
        # Defence-in-depth re-run of the PR gate. Same script, same
        # waiver file. A waiver that was valid at PR-merge time may
        # have EXPIRED by the time the release tag fires (waivers cap
        # at 90 days per G1 policy) — that's intentional. ROADMAP §3 G1.
        run: python3 scripts/check-npm-audit.py

      - name: Check license allowlist (G1) — MIT/BSD/Apache/CC0/ISC family
        # Re-run with the release-time install tree (npm ci runs in the
        # step above so we know node_modules matches the lockfile we're
        # about to publish). ROADMAP §3 G1.
        run: python3 scripts/check-license-allowlist.py

      - name: Install OSV-Scanner (G1) — second-opinion vulnerability scanner
        env:
          OSV_SCANNER_VERSION: 'v2.3.8'
        run: |
          set -eu
          mkdir -p "${RUNNER_TEMP}/osv-bin"
          curl -sLfo "${RUNNER_TEMP}/osv-bin/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          chmod +x "${RUNNER_TEMP}/osv-bin/osv-scanner"
          echo "${RUNNER_TEMP}/osv-bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/osv-bin/osv-scanner" --version

      - name: Run OSV-Scanner against the viz lockfile (G1)
        run: |
          set -eu
          osv-scanner --format=json \
            --lockfile=./better_map/appserver/static/visualizations/better_map/package-lock.json \
            --output-file=osv-report.json || true
          test -s osv-report.json

      - name: Assert OSV-Scanner findings (G1)
        run: python3 scripts/check-osv-report.py osv-report.json

      - name: Run unit tests (vitest, T-1 scaffold)
        # G2 close-out audit (PR after #41) — defence-in-depth re-run
        # of the PR-gate vitest suite. popupSanitizer.js carries 71
        # security-critical cases (every popup HTML string, every map
        # URL, and every image src flows through one of its exports);
        # a release built from a non-main commit must NOT skip them.
        # See docs/CI-GATES.md release-matrix #12.
        env:
          CI: 'true'
        working-directory: better_map/appserver/static/visualizations/better_map
        run: npm test

      - name: Build webpack production bundle
        working-directory: better_map/appserver/static/visualizations/better_map
        run: npm run build

      - name: Check production-bundle console noise (Q-2)
        run: node scripts/check-bundle-console-noise.js

      - name: Check bundle-size budget (Q-3)
        run: node scripts/check-bundle-size.js

      - name: Read Playwright version from package-lock (D2 + D3 cache key)
        # Same pattern as ci.yml: the cache below is keyed on the EXACT
        # Playwright version pulled into the viz package, so a version
        # bump in package-lock.json forces a clean re-install. Reuses
        # the same `runner.os-playwright-<version>` key as ci.yml so
        # the PR-gate's warm cache (populated at PR-merge time) carries
        # straight through to the tag-gate without paying the cold
        # download cost again.
        id: playwright-version
        working-directory: ${{ github.workspace }}
        run: |
          v=$(node -e "console.log(require('./better_map/appserver/static/visualizations/better_map/package-lock.json').packages['node_modules/playwright'].version)")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Playwright lockfile version: $v"

      - name: Cache Playwright browser binaries (D2 + D3)
        # Cache key is identical to ci.yml so cache hits cross workflows.
        # See ci.yml for the full rationale; the short version: cold
        # install of all three engine families takes ~10 min, warm hit
        # is 0 s.
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers (D2 + D3 — only on cache miss)
        # Skipped on cache hits — browsers are already on disk under
        # ~/.cache/ms-playwright from the previous run with the same
        # Playwright version (typically the PR that merged into the
        # tagged commit, since tags are cut from main HEAD).
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium firefox webkit

      - name: Install Playwright system deps (D2 + D3 — always)
        # System libraries live outside the cached ~/.cache/ms-playwright
        # tree, so they MUST re-`apt-get install` on every runner. apt
        # is fast on warm runners (~10 s).
        run: npx playwright install-deps chromium firefox webkit

      - name: Check accessibility (D3 — axe-core on formatter.html)
        # G2 close-out audit (PR after #41) — defence-in-depth re-run of
        # the PR-gate D3 axe-core audit against the fresh bundle. ZERO
        # WCAG 2.0 A/AA + 2.1 A/AA + 2.2 AA violations is the bar.
        # JSON report is uploaded for offline triage. See ROADMAP §3 D3
        # + docs/CI-GATES.md release-matrix #16.
        run: node scripts/check-accessibility.js

      - name: Upload accessibility report (D3)
        # `always()` so the report is downloadable even on failure.
        # 90-day retention matches the AppInspect-report retention for
        # release artefacts (PR runs use 14 days; releases keep evidence
        # longer for post-publication audits).
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-report-v${{ steps.tag.outputs.version }}
          path: reports/accessibility-report.json
          retention-days: 90
          if-no-files-found: warn

      - name: Check browser compatibility (D2 — formatter.html + visualization.js in chromium + firefox + webkit)
        # G2 close-out audit (PR after #41) — defence-in-depth re-run of
        # the PR-gate D2 Phase 1 (formatter.html load test) AND Phase 1.5
        # (visualization.js AMD-eval test) against the fresh bundle. The
        # bundle being released MUST parse + execute under WebKit and
        # Firefox; without this gate a tag from a non-main commit could
        # silently ship a bundle that breaks in Safari / iOS. See
        # ROADMAP §3 D2 + docs/COMPAT-MATRIX.md + docs/CI-GATES.md
        # release-matrix #17.
        run: node scripts/check-browser-compat.js

      - name: Upload browser-compat report (D2)
        # `always()` so the full per-engine error list + three screenshots
        # are available for offline triage. 90-day retention matches the
        # release accessibility report.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-compat-report-v${{ steps.tag.outputs.version }}
          path: |
            reports/browser-compat-report.json
            reports/browser-compat/
          retention-days: 90
          if-no-files-found: warn

      - name: Stage shippable app contents (exclude dev-only files)
        # rsync the better_map/ tree into a staging dir with everything
        # NOT needed by the running Splunk app stripped out:
        #
        #   - node_modules/          — dev deps (~24 MB), restored via
        #                              npm ci on a build host, never
        #                              executed by Splunk Web.
        #   - src/                   — JS sources. The shipped bundle is
        #                              visualization.js; the sources are
        #                              available in the GitHub repo for
        #                              auditors.
        #   - scripts/               — repo-local build helpers
        #                              (build-pmtiles.sh, etc).
        #   - docs/                  — viz-internal design notes.
        #   - package.json /         — Node manifest; runtime never reads.
        #     package-lock.json
        #   - webpack.config.js      — build config.
        #   - .eslintrc.cjs /        — lint config.
        #     .eslintignore
        #   - harness.json           — Splunk viz dev-harness manifest.
        #   - AIR-GAPPED-PMTILES.md  — repo doc; lives in the GitHub README too.
        #
        # Anything NOT in the exclude list is included automatically, so
        # adding a new runtime asset later (e.g. preview.png variants,
        # bundled .glb models for B1) does not require workflow edits.
        # Also drop macOS artefacts and set deterministic 755/644 perms.
        run: |
          set -eu
          mkdir -p dist
          rsync -a \
            --exclude='node_modules' \
            --exclude='src' \
            --exclude='scripts' \
            --exclude='docs' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='webpack.config.js' \
            --exclude='.eslintrc.cjs' \
            --exclude='.eslintignore' \
            --exclude='.npmrc' \
            --exclude='harness.json' \
            --exclude='AIR-GAPPED-PMTILES.md' \
            --exclude='build-pmtiles.sh' \
            better_map/ dist/better_map/
          find dist/better_map -name '._*' -delete
          find dist/better_map -name '.DS_Store' -delete
          find dist/better_map -type d -exec chmod 755 {} \;
          find dist/better_map -type f -exec chmod 644 {} \;
          echo "--- staged tree top-level ---"
          ls -la dist/better_map | head -20
          echo "--- staged viz dir top-level ---"
          ls -la dist/better_map/appserver/static/visualizations/better_map | head -20

      - name: Package as Splunk app archive (.tar.gz + .spl)
        # COPYFILE_DISABLE is a macOS thing but harmless on Linux; we set
        # it anyway for parity with the local-build instructions in
        # splunk-app-packaging.mdc. The tarball has `better_map/` at the
        # top, which is what Splunk's app install expects. We also copy
        # the .tar.gz to a .spl sidekick — both extensions are valid
        # Splunk app archives and Splunkbase / AppInspect accept either.
        env:
          COPYFILE_DISABLE: '1'
        run: |
          set -eu
          VERSION="${{ steps.tag.outputs.version }}"
          TARBALL="better_map-v${VERSION}.tar.gz"
          SPL="better_map-v${VERSION}.spl"
          tar czf "$TARBALL" -C dist better_map
          cp "$TARBALL" "$SPL"
          # Smoke-check: there must be ZERO macOS forks inside the tar.
          fork_count=$(tar tzf "$TARBALL" | grep -c '\._' || true)
          if [ "$fork_count" != "0" ]; then
            echo "::error file=$TARBALL::macOS resource forks present ($fork_count)"
            exit 1
          fi
          # Sanity: top-level directory must be `better_map/` exactly,
          # not a build-host-specific prefix (e.g. user home path).
          top_dirs=$(tar tzf "$TARBALL" | awk -F/ '{print $1}' | sort -u)
          if [ "$top_dirs" != "better_map" ]; then
            echo "::error file=$TARBALL::expected single top dir 'better_map', got: $top_dirs"
            exit 1
          fi
          # Smoke-check: node_modules MUST NOT ship in the release tarball.
          nm_count=$(tar tzf "$TARBALL" | grep -c 'node_modules' || true)
          if [ "$nm_count" != "0" ]; then
            echo "::error file=$TARBALL::node_modules leaked into release archive ($nm_count entries)"
            exit 1
          fi
          # Smoke-check: src/ MUST NOT ship (we ship the built bundle, not source).
          src_count=$(tar tzf "$TARBALL" | grep -cE 'visualizations/better_map/src/' || true)
          if [ "$src_count" != "0" ]; then
            echo "::error file=$TARBALL::src/ leaked into release archive ($src_count entries)"
            exit 1
          fi
          # Smoke-check: visualization.js MUST be present (the whole point).
          if ! tar tzf "$TARBALL" | grep -q 'visualizations/better_map/visualization.js$'; then
            echo "::error file=$TARBALL::visualization.js missing from release archive"
            exit 1
          fi
          ls -la "$TARBALL" "$SPL"

      - name: Set up Python 3.11 (for splunk-appinspect)
        # Pulled in only after we have a packaged tarball to inspect.
        # If the PR-gate ran AppInspect on the same SHA, this is a re-run
        # against the release-built tarball (defence-in-depth: the binary
        # being released MUST be the binary that was inspected).
        # `cache-dependency-path` must point at a manifest with pinned
        # versions — we use the same shared file as ci.yml.
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-appinspect.txt

      - name: Install splunk-appinspect (pinned via requirements)
        # Same shared pin as ci.yml. See scripts/requirements-appinspect.txt
        # for the upgrade policy.
        run: |
          python3 -m venv .venv-appinspect
          .venv-appinspect/bin/pip install --quiet --upgrade pip
          .venv-appinspect/bin/pip install --quiet -r scripts/requirements-appinspect.txt

      - name: Run splunk-appinspect against the release tarball (G2-2)
        # Cloud + future tags — Splunkbase target. `--max-messages 100`
        # so the release log carries every offender without truncation.
        run: |
          set -eu
          VERSION="${{ steps.tag.outputs.version }}"
          TARBALL="better_map-v${VERSION}.tar.gz"
          mkdir -p dist-appinspect
          .venv-appinspect/bin/splunk-appinspect inspect \
            "$TARBALL" \
            --output-file dist-appinspect/report.json \
            --data-format json \
            --max-messages 100 \
            --included-tags cloud \
            --included-tags future

      - name: Assert AppInspect result (release-strict, fail on warnings)
        # Stricter than the PR gate: tagged releases must be zero-error,
        # zero-failure, zero-future_failure, AND zero-warning. We don't
        # ship a release on a "yellow" AppInspect run.
        run: python3 scripts/check-appinspect-results.py \
            --report dist-appinspect/report.json \
            --fail-on-warnings

      - name: Upload AppInspect report alongside release artifacts
        # Useful for post-release audits and Splunkbase submission.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appinspect-report-v${{ steps.tag.outputs.version }}
          path: dist-appinspect/report.json
          retention-days: 90
          if-no-files-found: warn

      - name: Compute SHA-256 checksums
        # Sidecar `.sha256` files in the standard `<hash>  <filename>`
        # format consumed by `sha256sum -c`. Customers can verify the
        # downloaded artifact with:
        #
        #     sha256sum -c better_map-vX.Y.Z.tar.gz.sha256
        run: |
          set -eu
          VERSION="${{ steps.tag.outputs.version }}"
          TARBALL="better_map-v${VERSION}.tar.gz"
          SPL="better_map-v${VERSION}.spl"
          sha256sum "$TARBALL" > "${TARBALL}.sha256"
          sha256sum "$SPL"     > "${SPL}.sha256"
          echo '--- SHA-256 ---'
          cat "${TARBALL}.sha256"
          cat "${SPL}.sha256"

      - name: Generate CycloneDX SBOM for runtime dependencies (G1)
        # @cyclonedx/cyclonedx-npm is the official CycloneDX SBOM
        # generator for npm projects. We pin the major (^4) and let
        # npx pull the latest minor/patch so we benefit from bug
        # fixes without an explicit dep on the repo-root package.json.
        # --omit dev: only redistributed deps (runtime) appear in the
        # SBOM, which matches the license + npm audit scope.
        # --output-format JSON: industry-standard SBOM format that
        # Splunkbase legal review consumes; the spec version is
        # CycloneDX 1.6 (the tool's default as of v4.2.x).
        # --validate: rejects the output if it doesn't pass the
        # CycloneDX schema. Defence against a future tool regression
        # shipping malformed JSON. Customers can re-validate with
        # `cyclonedx-cli validate` or any CycloneDX-aware tool.
        working-directory: better_map/appserver/static/visualizations/better_map
        run: |
          set -eu
          VERSION="${{ steps.tag.outputs.version }}"
          npx --yes @cyclonedx/cyclonedx-npm@^4 \
            --omit dev \
            --output-format JSON \
            --validate \
            --output-file ../../../../../better_map-v${VERSION}.sbom.json
          ls -la "../../../../../better_map-v${VERSION}.sbom.json"

      - name: SHA-256 checksum the SBOM
        run: |
          set -eu
          VERSION="${{ steps.tag.outputs.version }}"
          SBOM="better_map-v${VERSION}.sbom.json"
          sha256sum "$SBOM" > "${SBOM}.sha256"
          cat "${SBOM}.sha256"

      - name: Install cosign (Sigstore) for keyless signing (G1)
        # Sigstore's keyless flow uses the GitHub Actions OIDC token to
        # request a short-lived signing certificate from Fulcio (no
        # long-lived private key kept by the project). The signing
        # event is recorded in the Rekor public transparency log so
        # customers can verify it offline. Pinning the installer + the
        # cosign version makes the security boundary auditable.
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v2.4.1'

      - name: Sign release artifacts with cosign keyless (G1)
        # `--yes`            skip the "are you sure" prompt (CI is non-interactive).
        # `--bundle`         emit a single .cosign.bundle file containing the
        #                    signature, the signing certificate, and the Rekor
        #                    transparency-log inclusion proof. One file per
        #                    artifact: customers download artifact + bundle
        #                    + this workflow's identity and verify offline.
        # We sign three artifacts:
        #   - the tarball (the canonical install media)
        #   - the .spl alias (Splunkbase historically wanted .spl; identical
        #     bytes to the .tar.gz but customers verify whichever they
        #     downloaded)
        #   - the SBOM (so customers know the SBOM is the one this workflow
        #     generated, not a tampered version)
        run: |
          set -eu
          VERSION="${{ steps.tag.outputs.version }}"
          TARBALL="better_map-v${VERSION}.tar.gz"
          SPL="better_map-v${VERSION}.spl"
          SBOM="better_map-v${VERSION}.sbom.json"
          for f in "$TARBALL" "$SPL" "$SBOM"; do
            cosign sign-blob --yes \
              --bundle "${f}.cosign.bundle" \
              "$f"
            echo "signed: $f -> ${f}.cosign.bundle"
          done

      - name: Verify cosign signatures (G1 self-check)
        # Defence-in-depth: round-trip what we just signed BEFORE
        # publishing the release. If the bundle doesn't verify against
        # this workflow's identity (org/repo + workflow path + tag ref),
        # something went wrong in the sign step and we'd rather fail the
        # release than ship an unverifiable bundle. Customers run the
        # same command from docs/runbooks/supply-chain.md.
        env:
          # Identity regex: this exact workflow file on this repo, at
          # the ref that triggered the run (the tag).
          CERT_ID_REGEX: '^https://github\.com/${{ github.repository }}/\.github/workflows/release\.yml@${{ github.ref }}$'
        run: |
          set -eu
          VERSION="${{ steps.tag.outputs.version }}"
          for f in "better_map-v${VERSION}.tar.gz" "better_map-v${VERSION}.spl" "better_map-v${VERSION}.sbom.json"; do
            echo "::group::verify $f"
            cosign verify-blob \
              --bundle "${f}.cosign.bundle" \
              --certificate-identity-regexp "$CERT_ID_REGEX" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$f"
            echo "verified: $f"
            echo "::endgroup::"
          done

      - name: Create GitHub Release with auto-generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `--generate-notes` makes GitHub auto-build the release body
        # from the commits since the previous tag, using the
        # conventional-commits prefix mapping introduced in PR #1.
        # `--verify-tag` ensures we are publishing the exact tag the
        # workflow was triggered by (no race window where main moves
        # ahead of the tag between trigger and publish).
        # The asset list now carries 9 files: tarball + .spl + SBOM +
        # one .sha256 sidecar each + one .cosign.bundle each.
        run: |
          set -eu
          VERSION="${{ steps.tag.outputs.version }}"
          TAG="${{ steps.tag.outputs.tag }}"
          TARBALL="better_map-v${VERSION}.tar.gz"
          SPL="better_map-v${VERSION}.spl"
          SBOM="better_map-v${VERSION}.sbom.json"
          gh release create "$TAG" \
            "$TARBALL" \
            "${TARBALL}.sha256" \
            "${TARBALL}.cosign.bundle" \
            "$SPL" \
            "${SPL}.sha256" \
            "${SPL}.cosign.bundle" \
            "$SBOM" \
            "${SBOM}.sha256" \
            "${SBOM}.cosign.bundle" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
