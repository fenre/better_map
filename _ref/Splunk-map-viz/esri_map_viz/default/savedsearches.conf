[ESRI Web Map - Demo Points]
search = | makeresults count=5 \
| streamstats count as id \
| eval latitude=case(id=1,37.7749,id=2,34.0522,id=3,40.7128,id=4,41.8781,id=5,29.7604), \
longitude=case(id=1,-122.4194,id=2,-118.2437,id=3,-74.006,id=4,-87.6298,id=5,-95.3698), \
description=case(id=1,"San Francisco",id=2,"Los Angeles",id=3,"New York",id=4,"Chicago",id=5,"Houston"), \
_color=case(id=1,"#00A4FD",id=2,"#FFB300",id=3,"#00C853",id=4,"#F74B4A",id=5,"#9B59B6") \
| table latitude, longitude, description, _color
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
display.general.type = visualizations
display.visualizations.type = custom
display.visualizations.custom.type = esri_map_viz.esri_map_viz
display.visualizations.custom.esri_map_viz.esri_map_viz.basemap = esri-dark-gray
display.visualizations.custom.esri_map_viz.esri_map_viz.serviceUrl =
display.visualizations.custom.esri_map_viz.esri_map_viz.serviceType = feature
display.visualizations.custom.esri_map_viz.esri_map_viz.latField = latitude
display.visualizations.custom.esri_map_viz.esri_map_viz.lonField = longitude
display.visualizations.custom.esri_map_viz.esri_map_viz.tooltipField = description
display.visualizations.custom.esri_map_viz.esri_map_viz.geojsonField = geojson
display.visualizations.custom.esri_map_viz.esri_map_viz.centerLat = 39.8
display.visualizations.custom.esri_map_viz.esri_map_viz.centerLon = -98.5
display.visualizations.custom.esri_map_viz.esri_map_viz.initialZoom = 4
display.visualizations.custom.esri_map_viz.esri_map_viz.maxZoom = 18
display.visualizations.custom.esri_map_viz.esri_map_viz.showZoomControl = true
display.visualizations.custom.esri_map_viz.esri_map_viz.showScaleControl = false
display.visualizations.custom.esri_map_viz.esri_map_viz.autoFitBounds = true
