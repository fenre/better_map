#
# Better Map - a flagship Splunk custom map visualization
#

[install]
state = enabled
is_configured = false
build = 1
allows_disable = true

[launcher]
author = Better Map contributors
version = 1.0.0
description = Better Map - a flagship Splunk custom map visualization built on MapLibre GL JS. WebGL vector tiles, ten layer types including H3 hexbin and 3D extrusion, time scrubber, cross-panel coordination, four preset Studio dashboards, theme-aware, color-blind-safe.

[ui]
is_visible = true
label = Better Map

[package]
id = better_map
check_for_updates = false

[id]
name = better_map
version = 1.0.0
build = 1

[shclustering]
deployer_lookups_push_mode = preserve_lookups
deployer_push_mode = full

#
# Minimum Splunk Enterprise version. The custom-viz API improvements
# Better Map depends on landed in 10.2.
#
[requirements]
required_splunk_version = 10.2.0
