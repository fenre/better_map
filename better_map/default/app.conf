#
# Better Map - a flagship Splunk custom map visualization
#

[install]
state = enabled
is_configured = false
build = 1611
allows_disable = true

[launcher]
author = Better Map contributors
version = 1.6.2
description = Better Map - a Splunk custom map visualization built on MapLibre GL JS. Ten core layer types (markers, paths, polygons, choropleth, heat, H3 hexbin, supercluster, 3D extrusion, indoor floor-plan, vector-tile feature join), time scrubber with cross-panel coordination, theme-aware, color-blind-safe. v1.6 adds 25 opt-in fancy actions across widgets, layer modules, and Splunk-platform integrations; client-side spatial-analytics suite; scrubber upgrades; air-gapped PMTiles loader; five new showcase dashboards. v1.6.2 patch (BM-FIX-01 + BM-FIX-02): every v1.6 widget (geocoder, command palette, minimap, draw tools, measure, lasso, brushing, side-by-side, time-split, spatial-query nudge, markdown popup) plus the v1.6 scrubber sub-elements (rail wrapper, event dots, anomaly bands, reverse button) and markdown-popup KPI grid now ship with the missing positioning/layout/theme CSS so toggling them on via the control panel actually renders a clickable overlay on top of the map. All v1.6 features default to OFF; existing dashboards render unchanged.

[ui]
is_visible = true
label = Better Map

[package]
id = better_map
check_for_updates = false

#
# Canonical [id] stanza — Splunk 7.x+ form. AppInspect 4.x (G2-2) warns
# if this is absent. `name` must match the app folder name AND
# [package] id. We keep [package] for backwards compatibility with
# older tooling that still reads it.
#
[id]
name = better_map
version = 1.6.2

[shclustering]
deployer_lookups_push_mode = preserve_lookups
deployer_push_mode = full

#
# Minimum Splunk Enterprise version. The custom-viz API improvements
# Better Map depends on landed in 10.2.
#
[requirements]
required_splunk_version = 10.2.0
