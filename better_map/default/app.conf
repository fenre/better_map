#
# Better Map - a flagship Splunk custom map visualization
#

[install]
state = enabled
is_configured = false
build = 1600
allows_disable = true

[launcher]
author = Better Map contributors
version = 1.6.0
description = Better Map - a Splunk custom map visualization built on MapLibre GL JS. Ten core layer types (markers, paths, polygons, choropleth, heat, H3 hexbin, supercluster, 3D extrusion, indoor floor-plan, vector-tile feature join), time scrubber with cross-panel coordination, theme-aware, color-blind-safe. v1.6 adds 25 opt-in fancy actions across widgets, layer modules, and Splunk-platform integrations; client-side spatial-analytics suite; scrubber upgrades; air-gapped PMTiles loader; five new showcase dashboards. All v1.6 features default to OFF; existing dashboards render unchanged.

[ui]
is_visible = true
label = Better Map

[package]
id = better_map
check_for_updates = false

[shclustering]
deployer_lookups_push_mode = preserve_lookups
deployer_push_mode = full

#
# Minimum Splunk Enterprise version. The custom-viz API improvements
# Better Map depends on landed in 10.2.
#
[requirements]
required_splunk_version = 10.2.0
