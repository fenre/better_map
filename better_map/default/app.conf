#
# Better Map - a flagship Splunk custom map visualization
#

[install]
state = enabled
is_configured = false
build = 1701
allows_disable = true

[launcher]
author = Better Map contributors
version = 1.7.1
description = Better Map - a Splunk custom map visualization built on MapLibre GL JS. Ten core layer types (markers, paths, polygons, choropleth, heat, H3 hexbin, supercluster, 3D extrusion, indoor floor-plan, vector-tile feature join), time scrubber with cross-panel coordination, theme-aware, color-blind-safe. v1.7.1 patch: draw-tools and measure-tool toolbars in the top-left now show an inline hint ("Pick a shape, then click the map") so users understand the buttons are mode toggles and the actual drawing happens on the map canvas; tooltips upgraded to describe the full workflow; measure tool now also accepts Esc and Enter to cancel/finish. v1.7 closed three NOC-engagement gaps (Tier 1 #1 selected-feature emphasis decoupled from filtering, #2 inbound camera token control via acceptRemoteCamera, #3 per-row marker labels with field/zoom/colour/halo controls) and shipped three usability features (Tier 2 #4 featureDeselected event on empty-canvas click, #5 hover-preview popup distinct from click popup, #6 optional popup inline-style allowlist for inline severity colours).

[ui]
is_visible = true
label = Better Map

[package]
id = better_map
check_for_updates = false

#
# Canonical [id] stanza — Splunk 7.x+ form. AppInspect 4.x (G2-2) warns
# if this is absent. `name` must match the app folder name AND
# [package] id. We keep [package] for backwards compatibility with
# older tooling that still reads it.
#
[id]
name = better_map
version = 1.7.1

[shclustering]
deployer_lookups_push_mode = preserve_lookups
deployer_push_mode = full

#
# Minimum Splunk Enterprise version. The custom-viz API improvements
# Better Map depends on landed in 10.2.
#
[requirements]
required_splunk_version = 10.2.0
