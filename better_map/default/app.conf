#
# Better Map - a flagship Splunk custom map visualization
#

[install]
state = enabled
is_configured = false
build = 1700
allows_disable = true

[launcher]
author = Better Map contributors
version = 1.7.0
description = Better Map - a Splunk custom map visualization built on MapLibre GL JS. Ten core layer types (markers, paths, polygons, choropleth, heat, H3 hexbin, supercluster, 3D extrusion, indoor floor-plan, vector-tile feature join), time scrubber with cross-panel coordination, theme-aware, color-blind-safe. v1.6 adds 25 opt-in fancy actions across widgets, layer modules, and Splunk-platform integrations; client-side spatial-analytics suite; scrubber upgrades; air-gapped PMTiles loader; five new showcase dashboards. v1.6.3 patch (SPATIAL-1): spatial-query widget now emits into the documented `$better_map.spatial_query$` Dashboard Studio token (the showcase dashboards, savedsearches.conf.spec, and formatter.html help text always called for this name, but the widget defaulted to a non-namespaced `bm_spatial_filter`, so the spatial analytics showcase silently dropped every brushed/lassoed/drawn shape); brushing widget header clarifies it is intentionally visual-only and emits no token. v1.6.2 (BM-FIX-01 + BM-FIX-02): every v1.6 widget plus v1.6 scrubber sub-elements and markdown-popup KPI grid now ship with the missing positioning/layout/theme CSS so toggling them on via the control panel actually renders a clickable overlay on top of the map. All v1.6 features default to OFF; existing dashboards render unchanged.

[ui]
is_visible = true
label = Better Map

[package]
id = better_map
check_for_updates = false

#
# Canonical [id] stanza — Splunk 7.x+ form. AppInspect 4.x (G2-2) warns
# if this is absent. `name` must match the app folder name AND
# [package] id. We keep [package] for backwards compatibility with
# older tooling that still reads it.
#
[id]
name = better_map
version = 1.6.3

[shclustering]
deployer_lookups_push_mode = preserve_lookups
deployer_push_mode = full

#
# Minimum Splunk Enterprise version. The custom-viz API improvements
# Better Map depends on landed in 10.2.
#
[requirements]
required_splunk_version = 10.2.0
