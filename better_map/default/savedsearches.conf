#
# Better Map - minimal default savedsearches.conf
#
# This file exists to mirror viz settings into Splunk's conf system so they
# can be defaulted, documented (see README/savedsearches.conf.spec), and
# exported via REST. Phase 4 will populate a complete settings map.
#
# The formatter.html UI is the primary surface for end users; settings here
# act as fallbacks when the viz is instantiated without a formatter session
# (for example, when restored from a saved dashboard with stale options).
#
