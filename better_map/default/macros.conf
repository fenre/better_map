#
# SPL macros that complement the Better Map visualization.
#
# Use these from anywhere in Splunk Web with `\`better_map_<name>\``. Each
# macro is intentionally short and read-only so it composes well with
# customer searches.
#

[better_map_points(0)]
definition = | rename latitude AS lat longitude AS lon \
            | where isnotnull(lat) AND isnotnull(lon) \
            | where abs(lat) <= 90 AND abs(lon) <= 180
iseval = 0
description = Normalises the most common lat/lon aliases and drops invalid coordinates. Pipe the result into a `better_map` panel.

[better_map_iplocation(1)]
args = src_field
definition = | iplocation $src_field$ \
            | rename Latitude AS lat Longitude AS lon
iseval = 0
description = Resolves an IP address column to lat/lon using Splunk's bundled MaxMind table. Argument is the column name (no quotes).

[better_map_h3(2)]
args = lat_field, lon_field
definition = | eval bm_h3_res = case(isnotnull(bm_h3_res), bm_h3_res, true(), 7) \
            | eval bm_h3_cell = "geo_" . round($lat_field$, 1) . "_" . round($lon_field$, 1)
iseval = 0
description = Lightweight client-side stand-in for H3 cell identifiers. Use when h3 is needed in SPL aggregation but the H3 commands are unavailable. For real H3, install the H3 SPL add-on or let Better Map aggregate via the hexbin renderer.

[better_map_geocode(1)]
args = address_field
definition = | rex field=$address_field$ "(?<lat>-?\d+\.\d+)\s*,\s*(?<lon>-?\d+\.\d+)"
iseval = 0
description = Stub geocoder - extracts inline "lat,lon" strings from a free-text field. Replace with a real geocoding pipeline (e.g. Splunk Stream or external lookup) for production use.
