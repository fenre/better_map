#
# Visualization registration for Better Map.
#
# The stanza name MUST match the directory under
# appserver/static/visualizations/. The viz is then referenced from
# Dashboard Studio JSON as type = "better_map.better_map" (app_id.stanza).
#

[better_map]
label = Better Map
description = Flagship WebGL map visualization with ten layer types, time scrubber, 3D extrusion, H3 hexbin, vector-tile feature join, and cross-panel coordination.

#
# Module path is relative to appserver/static/visualizations/<stanza>/.
# Webpack writes the final AMD bundle to visualization.js.
#
core.type = visualization
core.version = 0.1.0
core.author = Better Map contributors
core.icon = icon.png
core.preview_image = preview.png
core.order_hint = 100

# Visualization API version. v3 is the current Splunk Enterprise 10.2+ contract.
schemaVersion = 3

# Data contract. The viz consumes a single search results table (rows of fields).
data_contract.allow_dynamic_options = false
data_contract.input_data_format = column_major
data_contract.requires_count_check = false

# Default search results limit. Maps comfortably with up to 100K points via GPU.
default_height = 480
search_fragment = | head 50000

# Tags surface the viz in the picker filters.
allow_user_selection = true
disabled = 0
