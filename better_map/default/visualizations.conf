#
# Visualization registration for Better Map.
#
# The stanza name MUST match the directory under
# appserver/static/visualizations/. The viz is then referenced from
# Dashboard Studio JSON as type = "better_map.better_map" (app_id.stanza).
#
# This stanza uses the CLASSIC Splunk custom-visualization registration
# (compatible with Splunk Enterprise 7.x through 10.2+ and Splunk Cloud).
# DO NOT add core.*, schemaVersion, data_contract.*, data_sources.*, or
# supports_* keys here — those belong to the modern Dashboard Studio v3
# native-plugin spec, which uses a different module loader and runtime
# contract. When Splunk sees those keys it tries to load this viz as a v3
# native plugin and ignores the AMD `SplunkVisualizationBase` bundle that
# webpack actually emits at appserver/static/visualizations/better_map/
# visualization.js — so the panel falls back to the grey placeholder.
#
# Reference (known-working pattern on Splunk Enterprise 10.2.3 in DS v2):
#   _ref/splunk-custom-visualizations/examples/gauge/default/visualizations.conf
#   _ref/splunk-custom-visualizations/splunk_health/default/visualizations.conf
#

[better_map]
label = Better Map
description = Flagship WebGL map visualization with ten layer types, time scrubber, 3D extrusion, H3 hexbin, vector-tile feature join, and cross-panel coordination.
default_height = 480
allow_user_selection = true
disabled = 0
search_fragment = | head 50000
